<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Payslip Generator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#383838;background:linear-gradient(#fff3ef 228px,#fff 228px);font-size:14px}.sheet{max-width:868px;margin:24px auto 76px;background:#fff;border:1px solid #f0e8e5;border-radius:11px;box-shadow:0 2px 9px #00000006;padding:50px 50px 80px;min-height:1298px}.top{display:flex;align-items:flex-start;gap:20px}.upload{width:157px;height:91px;flex-shrink:0;border:1px dashed #d6e5ff;background:#fafbff;border-radius:5px;color:#4888ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;overflow:hidden}.upload svg{width:26px;height:26px}.upload img{max-width:100%;max-height:100%;object-fit:contain}.upload-info{padding-top:18px;color:#111;line-height:1.9}.upload-info small{display:block;font-size:10px;font-weight:600;line-height:1.7}.month{margin-left:auto;text-align:right;padding-top:11px;color:#777;font-size:16px}.month strong{display:block;color:#0b0b0b;font-size:21px;font-weight:500;margin-top:8px}.company{width:370px;margin-top:19px}.line{width:100%;border:0;border-bottom:1px dashed #dbe7ff;outline:none;height:33px;background:transparent;padding:5px 12px;color:#222;font-size:14px}.line::placeholder{color:#808080}.company .line:first-child{font-size:20px}.section{margin-top:50px}.section h3{font-size:16px;margin:0 0 17px;font-weight:600}.req{color:#f2443e}.rule{border-top:1px solid #f0f0f0;margin-bottom:18px}.employee-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:88px;row-gap:2px}.field{display:grid;grid-template-columns:130px 9px minmax(0,1fr);align-items:center;min-height:36px;font-size:14px}.field input{min-width:0}.field .line{height:34px;padding-left:6px}.add{background:none;border:0;color:#4888ff;cursor:pointer;font-size:14px;padding:0;text-align:left}.add:hover{text-decoration:underline}.add-row{margin-top:22px}.income{margin-top:72px}.income-table{border:1px solid #eef0f4;border-radius:6px;box-shadow:0 5px 13px #00000008;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.income-half:first-child{border-right:1px solid #f0f0f0}.th{display:grid;grid-template-columns:1fr 100px;padding:15px 20px;border-bottom:1px solid #f2f2f2;font-size:15px}.salary-rows{padding:9px 20px 0}.salary-row{display:grid;grid-template-columns:1fr 100px;align-items:center;min-height:39px;gap:8px}.salary-row .line{width:100%;text-align:right}.salary-row input.name{border:0;outline:none;width:100%;font-size:14px;color:#111;background:transparent}.salary-row .remove{background:none;border:0;color:#f44336;cursor:pointer;font-size:16px;padding:3px}.salary-row .amount-wrap{display:flex;align-items:center}.salary-row .amount-wrap input{min-width:0}.salary-add{padding:13px 20px 17px}.total{background:#f8f8fa;display:flex;justify-content:space-between;padding:16px 20px;font-size:15px}.net{display:grid;grid-template-columns:3fr 1fr;margin-top:40px;border:1px solid #edf0f5;border-radius:10px;overflow:hidden;min-height:89px}.net .left{padding:17px 20px;font-size:18px}.net .left small{display:block;color:#777;font-size:15px;margin-top:12px}.net .right{background:#f8f8fa;display:flex;justify-content:flex-end;align-items:center;padding:20px 30px;font-size:20px;font-weight:bold}.words{text-align:right;margin:17px 0 19px;font-size:14px}.bottom{border-top:1px solid #eee;padding-top:80px;display:flex;justify-content:center;gap:30px}.btn{border:1px solid #26313c;border-radius:8px;padding:16px 30px;font-size:16px;font-weight:bold;cursor:pointer;background:white;color:#111}.primary{background:#f4433d;color:white;border-color:#f4433d}.btn:hover{filter:brightness(.97)}.custom-field{display:grid;grid-template-columns:1fr 1fr;gap:10px}.custom-field input{width:100%}.print-view{display:none}.note{color:#999;font-size:11px;margin-top:8px}@media(max-width:760px){.sheet{margin:12px;padding:25px 20px;min-height:unset}.top{flex-wrap:wrap}.month{width:100%;text-align:left;margin:5px 0}.company{width:100%}.employee-grid{grid-template-columns:1fr;gap:5px}.field{grid-template-columns:120px 9px minmax(0,1fr)}.income-table{grid-template-columns:1fr}.income-half:first-child{border-right:0;border-bottom:1px solid #eee}.income{margin-top:45px}.bottom{padding-top:40px;gap:12px}.btn{padding:14px 16px;font-size:14px}}@media print{body{background:#fff}.sheet{display:none}.print-view{display:block;padding:20px;font-size:13px;color:#222}.print-view table{width:100%;border-collapse:collapse;margin:20px 0}.print-view td,.print-view th{padding:12px;border:1px solid #ddd;text-align:left}.print-view .print-header{display:flex;justify-content:space-between;align-items:center}.print-view .print-logo{max-width:150px;max-height:85px}.print-view h1{margin:0}.print-view .print-net{text-align:right;font-size:20px;font-weight:bold}}
</style></head><body><main class="sheet"><div class="top"><label class="upload" for="logoInput" id="logoPreview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 17v3h16v-3M12 16V5m-4 4 4-4 4 4"/><path d="M5 12a8 8 0 1 1 14 0"/></svg><span>Upload</span></label><input type="file" id="logoInput" accept="image/*" hidden><div class="upload-info">Upload Logo<small>240 x 240 pixels @ 72 DPI.<br>Maximum size of 1MB.</small></div><div class="month">Payslip For the Month<strong id="monthHeading">November 2026</strong></div></div><div class="company"><input class="line" id="companyName" placeholder="Company Name*"><input class="line" id="companyAddress" placeholder="Company Address"><input class="line" id="city" placeholder="City, Pincode"><input class="line" id="country" value="India" placeholder="Country"></div><section class="section"><h3>Employee Pay Summary <span class="req">*</span></h3><div class="rule"></div><div class="employee-grid"><label class="field"><span>Employee Name</span><span>:</span><input class="line" id="employeeName" placeholder="Eg: Meera Krishnan"></label><label class="field"><span>Employee ID</span><span>:</span><input class="line" id="employeeId" placeholder="Eg: 1234"></label><label class="field"><span>Pay Period</span><span>:</span><input class="line" id="payPeriod" type="month" value="2026-11"></label><label class="field"><span>Paid Days</span><span>:</span><input class="line" id="paidDays" type="number" min="0" placeholder="Eg: 22"></label><label class="field"><span>Loss of Pay Days</span><span>:</span><input class="line" id="lossDays" type="number" min="0" value="0"></label><label class="field"><span>Pay Date</span><span>:</span><input class="line" id="payDate" type="date" value="2026-11-01"></label></div><div id="customFields" class="employee-grid"></div><div class="add-row"><button class="add" id="addField">✚ Add another field</button></div></section><section class="section income"><h3>Income Details <span class="req">*</span></h3><div class="income-table"><div class="income-half"><div class="th"><span>Earnings</span><span style="text-align:center">Amount</span></div><div class="salary-rows" id="earnings"></div><div class="salary-add"><button class="add" id="addEarning">✚ Add Earnings</button></div><div class="total"><span>Gross Earnings</span><span id="gross">₹0</span></div></div><div class="income-half"><div class="th"><span>Deductions</span><span style="text-align:center">Amount</span></div><div class="salary-rows" id="deductions"></div><div class="salary-add"><button class="add" id="addDeduction">✚ Add Deductions</button></div><div class="total"><span>Total Deductions</span><span id="deductTotal">₹0</span></div></div></div><div class="net"><div class="left">Total Net Payable<small>Gross Earnings - Total Deductions</small></div><div class="right" id="net">₹0</div></div><div class="words">Amount in words : <span id="words"></span></div></section><div class="bottom"><button class="btn primary" id="generate">Generate Payslip</button><button class="btn" id="reset">↻ &nbsp;Reset</button></div></main><div class="print-view" id="printView"></div><script>
const KEY='payslip_generator_v1';const $=id=>document.getElementById(id);const defaults={earnings:[{name:'Basic',amount:0},{name:'House Rent Allowance',amount:0}],deductions:[{name:'Income Tax',amount:0},{name:'Provident Fund',amount:0}],custom:[]};let state={...structuredClone(defaults),logo:''};const ids=['companyName','companyAddress','city','country','employeeName','employeeId','payPeriod','paidDays','lossDays','payDate'];const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){const data={...state,fields:Object.fromEntries(ids.map(id=>[id,$(id).value]))};try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Browser storage is full. Try a smaller logo.')}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){state={...structuredClone(defaults),...s};for(const id of ids)if(s.fields&&id in s.fields)$(id).value=s.fields[id]}}catch(e){}render();}
function renderLogo(){const el=$('logoPreview');el.innerHTML=state.logo?`<img alt="Company logo" src="${state.logo}">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 17v3h16v-3M12 16V5m-4 4 4 4"/><path d="M5 12a8 8 0 1 1 14 0"/></svg><span>Upload</span>'}
function renderRows(type){const wrap=$(type);wrap.innerHTML='';state[type].forEach((item,i)=>{const row=document.createElement('div');row.className='salary-row';row.innerHTML=`<input class="name" aria-label="${type} name" value="${esc(item.name)}"><div class="amount-wrap"><input class="line" aria-label="${type} amount" type="number" min="0" step="0.01" value="${esc(item.amount)}">${i>=2?'<button class="remove" title="Remove" aria-label="Remove row">×</button>':''}</div>`;row.querySelector('.name').addEventListener('input',e=>{item.name=e.target.value;save()});row.querySelector('.line').addEventListener('input',e=>{item.amount=e.target.value;calculate();save()});row.querySelector('.remove')?.addEventListener('click',()=>{state[type].splice(i,1);renderRows(type);calculate();save()});wrap.appendChild(row)})}
function renderCustom(){const wrap=$('customFields');wrap.innerHTML='';state.custom.forEach((item,i)=>{const row=document.createElement('div');row.className='field';row.innerHTML=`<input class="line" aria-label="Field name" placeholder="Field name" value="${esc(item.name)}"><span>:</span><div style="display:flex"><input class="line" aria-label="Field value" placeholder="Value" value="${esc(item.value)}"><button class="remove" style="border:0;background:none;color:#f44336;cursor:pointer" aria-label="Remove field">×</button></div>`;const inputs=row.querySelectorAll('input');inputs[0].addEventListener('input',e=>{item.name=e.target.value;save()});inputs[1].addEventListener('input',e=>{item.value=e.target.value;save()});row.querySelector('button').addEventListener('click',()=>{state.custom.splice(i,1);renderCustom();save()});wrap.appendChild(row)})}
function numberWords(num){num=Math.floor(Math.abs(num));if(!num)return 'Zero';const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const under100=n=>n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');const under1000=n=>(n>=100?ones[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?under100(n%100):'');let out=[];for(const [v,label] of [[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand'],[1,'']]){const part=Math.floor(num/v);if(part){out.push((part<1000?under1000(part):numberWords(part))+(label?' '+label:''));num%=v}}return out.join(' ')}
function calculate(){const sum=type=>state[type].reduce((s,r)=>s+Math.max(0,Number(r.amount)||0),0);const gross=sum('earnings'),deduct=sum('deductions'),net=gross-deduct;$('gross').textContent=money(gross);$('deductTotal').textContent=money(deduct);$('net').textContent=money(net);const rupees=Math.floor(Math.abs(net)),paise=Math.round((Math.abs(net)-rupees)*100);$('words').textContent=(net<0?'Minus ':'')+numberWords(rupees)+' Rupees'+(paise?' and '+numberWords(paise)+' Paise':'')+' Only';const p=$('payPeriod').value;if(/^\d{4}-\d{2}$/.test(p))$('monthHeading').textContent=new Date(p+'-01T12:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function render(){renderLogo();renderRows('earnings');renderRows('deductions');renderCustom();calculate()}
ids.forEach(id=>$(id).addEventListener('input',()=>{calculate();save()}));$('logoInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(file.size>1024*1024){alert('Maximum logo size is 1MB.');e.target.value='';return}if(!file.type.startsWith('image/')){alert('Please select an image.');return}const reader=new FileReader();reader.onload=()=>{state.logo=reader.result;renderLogo();save()};reader.readAsDataURL(file)});$('addField').onclick=()=>{state.custom.push({name:'',value:''});renderCustom();save()};$('addEarning').onclick=()=>{state.earnings.push({name:'',amount:0});renderRows('earnings');save()};$('addDeduction').onclick=()=>{state.deductions.push({name:'',amount:0});renderRows('deductions');save()};$('reset').onclick=()=>{if(!confirm('Reset all payslip details and remove saved data?'))return;localStorage.removeItem(KEY);location.reload()};
$('generate').onclick=()=>{if(!$('companyName').value.trim()||!$('employeeName').value.trim()){alert('Please enter Company Name and Employee Name.');return}calculate();const info=(label,value)=>`<tr><td>${esc(label)}</td><td>${esc(value)}</td></tr>`;const table=(type)=>state[type].map(r=>`<tr><td>${esc(r.name)}</td><td style="text-align:right">${money(r.amount)}</td></tr>`).join('');$('printView').innerHTML=`<div class="print-header"><div>${state.logo?`<img class="print-logo" src="${state.logo}" alt="Logo">`:''}<h2>${esc($('companyName').value)}</h2><div>${esc($('companyAddress').value)}</div><div>${esc($('city').value)}, ${esc($('country').value)}</div></div><div style="text-align:right"><h1>Payslip</h1><h3>${esc($('monthHeading').textContent)}</h3></div></div><h3>Employee Pay Summary</h3><table>${info('Employee Name',$('employeeName').value)}${info('Employee ID',$('employeeId').value)}${info('Pay Period',$('monthHeading').textContent)}${info('Paid Days',$('paidDays').value)}${info('Loss of Pay Days',$('lossDays').value)}${info('Pay Date',$('payDate').value)}${state.custom.map(x=>info(x.name,x.value)).join('')}</table><h3>Income Details</h3><table><tr><th>Earnings</th><th>Amount</th></tr>${table('earnings')}<tr><th>Gross Earnings</th><th>${esc($('gross').textContent)}</th></tr></table><table><tr><th>Deductions</th><th>Amount</th></tr>${table('deductions')}<tr><th>Total Deductions</th><th>${esc($('deductTotal').textContent)}</th></tr></table><p class="print-net">Total Net Payable: ${esc($('net').textContent)}</p><p>Amount in words: ${esc($('words').textContent)}</p>`;window.print()};load();
</script></body></html>
